<!doctype html>
<html lang="lo" data-lang="lo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NB LAO — Admin Dashboard</title>
    <link rel="icon" type="image/png" href="/image/LOGO-NB.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/nblao.css" />
    <style>
      /* ---- Admin-specific overrides ---- */
      body {
        background: #f5f7fa;
      }
      .login-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--header-bg);
      }
      .login-box {
        background: #fff;
        border-radius: 6px;
        padding: 40px 36px;
        width: 380px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .login-box h2 {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 6px;
        color: var(--blueprint-deep);
      }
      .login-box .sub {
        font-size: 13px;
        color: var(--steel);
        margin-bottom: 24px;
      }
      .login-box .field {
        margin-bottom: 16px;
      }
      .login-box .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--steel);
      }
      .login-box .field input {
        width: 100%;
        border: 1.5px solid var(--line);
        border-radius: 3px;
        padding: 10px 12px;
        font-family: inherit;
        font-size: 13.5px;
        outline: none;
      }
      .login-box .field input:focus {
        border-color: var(--blueprint);
      }
      .login-box .btn-primary {
        width: 100%;
        padding: 12px;
        font-size: 14px;
      }
      .login-error {
        color: var(--safety-deep);
        font-size: 12.5px;
        margin-top: 10px;
        display: none;
      }
      .hidden {
        display: none !important;
      }

      /* Sidebar */
      .admin-side .a-header {
        padding: 18px 20px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        margin-bottom: 8px;
        text-align: center;
      }
      .admin-logo-img {
        height: 44px;
        max-width: 160px;
        object-fit: contain;
        display: block;
        margin: 0 auto 8px;
      }
      .admin-side .a-header p {
        color: rgba(255, 255, 255, 0.55);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 12px;
      }
      .admin-lang-selector {
        position: relative;
        display: flex;
        justify-content: center;
      }
      .admin-lang-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #fff;
        padding: 6px 14px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 12.5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
        transition: all 0.2s ease;
        min-width: 140px;
        justify-content: center;
      }
      .admin-lang-btn:hover {
        background: rgba(255, 255, 255, 0.13);
        border-color: rgba(212, 175, 55, 0.65);
      }
      .admin-lang-btn .lang-globe {
        font-size: 14px;
      }
      .admin-lang-btn .lang-arrow {
        font-size: 10px;
        opacity: 0.6;
        margin-left: auto;
      }
      .admin-lang-menu {
        position: absolute;
        top: 110%;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        min-width: 150px;
        display: none;
        z-index: 200;
        overflow: hidden;
      }
      .admin-lang-menu.open {
        display: block;
      }
      .admin-lang-option {
        padding: 9px 16px;
        font-size: 13px;
        color: #082e61;
        cursor: pointer;
        transition: background 0.12s;
      }
      .admin-lang-option:hover {
        background: #eaf4ff;
      }
      .admin-lang-option[data-lang="lo"] {
        color: #0099ff;
        font-weight: 600;
      }
      .admin-side .a-nav {
        padding: 4px 0;
      }
      .admin-link {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 20px;
        font-size: 13.5px;
        cursor: pointer;
        border-left: 3px solid transparent;
        color: #b9c6d1;
        transition: 0.12s;
      }
      .admin-link:hover {
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
      }
      .admin-link.on {
        background: rgba(255, 255, 255, 0.15);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .admin-link .ico {
        width: 18px;
        text-align: center;
        font-size: 14px;
      }
      .admin-side .a-footer {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 14px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }
      .admin-side .a-footer .logout-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: rgba(255, 255, 255, 0.85);
        padding: 8px 14px;
        border-radius: 3px;
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        width: 100%;
        text-align: center;
      }
      .admin-side .a-footer .logout-btn:hover {
        border-color: var(--safety);
        color: #fff;
      }
      .admin-side {
        position: relative;
        padding-bottom: 60px;
      }

      /* Main content */
      .admin-main h2 {
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 20px;
      }
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .page-header h2 {
        margin-bottom: 0;
      }

      /* Stats */
      .a-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 26px;
      }

      /* Tables */
      .a-table {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      .a-table table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .a-table th {
        text-align: left;
        background: var(--paper-2);
        padding: 10px 14px;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--steel);
      }
      .a-table td {
        padding: 12px 14px;
        border-top: 1px solid var(--line);
      }
      .a-table tr:hover {
        background: var(--paper);
      }
      .a-table .code {
        font-family: "IBM Plex Mono", monospace;
        color: var(--blueprint);
      }
      .a-table .actions {
        display: flex;
        gap: 6px;
      }
      .a-table .btn-sm {
        padding: 5px 10px;
        font-size: 11.5px;
        border-radius: 3px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
        font-family: inherit;
      }
      .a-table .btn-sm:hover {
        background: var(--paper-2);
      }
      .a-table .btn-sm.danger {
        color: var(--safety-deep);
        border-color: var(--safety);
      }
      .a-table .btn-sm.danger:hover {
        background: var(--warn-bg);
      }

      /* Status pills */
      .status-pill {
        font-size: 11px;
        font-weight: 600;
        padding: 4px 9px;
        border-radius: 20px;
        display: inline-block;
      }
      .st-pending {
        background: #e4e9ee;
        color: var(--blueprint-deep);
      }
      .st-confirmed,
      .st-reviewed,
      .st-accepted {
        background: var(--success-bg);
        color: var(--success);
      }
      .st-processing,
      .st-quoted {
        background: var(--warn-bg);
        color: var(--safety-deep);
      }
      .st-shipped {
        background: #e0ecff;
        color: #2563eb;
      }
      .st-delivered {
        background: var(--success-bg);
        color: var(--success);
      }
      .st-cancelled,
      .st-rejected {
        background: #fee2e2;
        color: #dc2626;
      }
      .st-active {
        background: var(--success-bg);
        color: var(--success);
      }
      .st-inactive {
        background: #fee2e2;
        color: #dc2626;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal-box {
        background: #fff;
        border-radius: 6px;
        padding: 28px;
        width: 520px;
        max-width: 95vw;
        max-height: 85vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }
      .modal-box h3 {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      .modal-box .field {
        margin-bottom: 14px;
      }
      .modal-box .field label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        margin-bottom: 5px;
        color: var(--steel);
      }
      .modal-box .field input,
      .modal-box .field select,
      .modal-box .field textarea {
        width: 100%;
        border: 1.5px solid var(--line);
        border-radius: 3px;
        padding: 9px 12px;
        font-family: inherit;
        font-size: 13px;
        outline: none;
      }
      .modal-box .field input:focus,
      .modal-box .field textarea:focus {
        border-color: var(--blueprint);
      }
      .modal-box .field textarea {
        resize: vertical;
        min-height: 60px;
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .modal-actions .btn-primary {
        padding: 9px 18px;
      }
      .modal-actions .btn-ghost {
        padding: 9px 18px;
        border-color: var(--line);
        color: var(--steel);
      }
      .modal-actions .btn-ghost:hover {
        background: var(--paper-2);
      }
      .field-row-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      /* Toast */
      .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--safety);
        color: #fff;
        padding: 12px 20px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 600;
        z-index: 2000;
        opacity: 0;
        transform: translateY(-10px);
        transition: 0.3s;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .toast.error {
        background: var(--safety-deep);
      }

      /* Order detail inline */
      .order-detail-items {
        margin-top: 10px;
      }
      .order-detail-items td {
        font-size: 12.5px;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 50px 20px;
        color: var(--steel);
      }
      .empty-state .ico {
        font-size: 40px;
        margin-bottom: 12px;
      }
      .empty-state p {
        font-size: 14px;
      }

      @media (max-width: 900px) {
        .a-stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .modal-box {
          width: 100%;
          margin: 10px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ═══════════ LOGIN SCREEN ═══════════ -->
    <div id="loginScreen" class="login-screen">
      <div class="login-box">
        <div style="text-align: center; margin-bottom: 20px">
          <span
            style="
              font-family: &quot;IBM Plex Mono&quot;, monospace;
              font-weight: 700;
              font-size: 22px;
              color: var(--blueprint-deep);
            "
            >NB LAO</span
          >
          <span
            style="
              display: inline-block;
              width: 8px;
              height: 8px;
              background: var(--accent);
              margin-left: 4px;
              vertical-align: middle;
            "
          ></span>
        </div>
        <h2 id="loginTitle">ເຂົ້າສູ່ລະບົບຜູ້ບໍລິຫານ</h2>
        <p class="sub" id="loginSubtitle">ເຂົ້າສູ່ລະບົບຜູ້ບໍລິຫານ</p>
        <div class="field">
          <label id="loginEmailLabel">ອີເມວ</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="admin@nblao.la"
          />
        </div>
        <div class="field">
          <label id="loginPasswordLabel">ລະຫັດຜ່ານ</label>
          <input type="password" id="loginPass" placeholder="Password" />
        </div>
        <button class="btn-primary" id="loginBtn" onclick="doLogin()">
          ເຂົ້າສູ່ລະບົບ
        </button>
        <p class="login-error" id="loginError"></p>
      </div>
    </div>

    <!-- ═══════════ ADMIN SHELL ═══════════ -->
    <div id="adminShell" class="admin-shell hidden">
      <!-- Sidebar -->
      <aside class="admin-side">
        <div class="a-header" id="adminBranding">
          <img src="/image/LOGO.png" alt="NB LAO" class="admin-logo-img" />
          <p id="adminPortalLabel">Admin Portal</p>
          <div class="admin-lang-selector" id="adminLangSelector">
            <button
              class="admin-lang-btn"
              id="adminLangBtn"
              onclick="toggleAdminLangMenu()"
            >
              <span class="lang-globe">🌐</span>
              <span id="adminLangLabel">Lao</span>
              <span class="lang-arrow">▾</span>
            </button>
            <div class="admin-lang-menu" id="adminLangMenu">
              <div
                class="admin-lang-option"
                data-lang="lo"
                onclick="switchAdminLang('lo')"
              >
                ພາສາລາວ
              </div>
              <div
                class="admin-lang-option"
                data-lang="en"
                onclick="switchAdminLang('en')"
              >
                English
              </div>
            </div>
          </div>
        </div>
        <nav class="a-nav">
          <div
            class="admin-link on"
            data-page="dashboard"
            onclick="navigateTo('dashboard')"
          >
            <span class="ico">📊</span> Dashboard
          </div>
          <div
            class="admin-link"
            data-page="products"
            onclick="navigateTo('products')"
          >
            <span class="ico">📦</span> Products
          </div>
          <div
            class="admin-link"
            data-page="categories"
            onclick="navigateTo('categories')"
          >
            <span class="ico">📁</span> Categories
          </div>
          <div
            class="admin-link"
            data-page="brands"
            onclick="navigateTo('brands')"
          >
            <span class="ico">🏷️</span> Brands
          </div>
          <div
            class="admin-link"
            data-page="orders"
            onclick="navigateTo('orders')"
          >
            <span class="ico">🛒</span> Orders
          </div>
          <div
            class="admin-link"
            data-page="customers"
            onclick="navigateTo('customers')"
          >
            <span class="ico">👥</span> Customers
          </div>
          <div
            class="admin-link"
            data-page="quotations"
            onclick="navigateTo('quotations')"
          >
            <span class="ico">📄</span> Quotations
          </div>
          <div
            class="admin-link"
            data-page="staff"
            onclick="navigateTo('staff')"
          >
            <span class="ico">🔑</span> Staff
          </div>
          <div
            class="admin-link"
            data-page="positions"
            onclick="navigateTo('positions')"
          >
            <span class="ico">💼</span> Positions
          </div>
          <div
            class="admin-link"
            data-page="loyalty"
            onclick="navigateTo('loyalty')"
          >
            <span class="ico">⭐</span> Loyalty
          </div>
          <div
            class="admin-link"
            data-page="reviews"
            onclick="navigateTo('reviews')"
          >
            <span class="ico">⭐</span> Reviews
          </div>
          <div
            class="admin-link"
            data-page="coupons"
            onclick="navigateTo('coupons')"
          >
            <span class="ico">🎫</span> Coupons
          </div>
          <div
            class="admin-link"
            data-page="shipping"
            onclick="navigateTo('shipping')"
          >
            <span class="ico">🚚</span> Shipping
          </div>
          <div
            class="admin-link"
            data-page="payment-methods"
            onclick="navigateTo('payment-methods')"
          >
            <span class="ico">💳</span> Payment Methods
          </div>
          <div
            class="admin-link"
            data-page="variants"
            onclick="navigateTo('variants')"
          >
            <span class="ico">🔄</span> Variants
          </div>
          <div
            class="admin-link"
            data-page="sales"
            onclick="navigateTo('sales')"
          >
            <span class="ico">📊</span> Sales
          </div>
          <div
            class="admin-link"
            data-page="inventory"
            onclick="navigateTo('inventory')"
          >
            <span class="ico">📦</span> Inventory
          </div>
          <div
            class="admin-link"
            data-page="audit"
            onclick="navigateTo('audit')"
          >
            <span class="ico">📋</span> Audit Logs
          </div>
          <div
            class="admin-link"
            data-page="emails"
            onclick="navigateTo('emails')"
          >
            <span class="ico">📧</span> Emails
          </div>
        </nav>

        <div class="a-footer">
          <button class="logout-btn" onclick="doLogout()">
            Logout — ອອກຈາກລະບົບ
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="admin-main" id="adminMain">
        <!-- Content injected by JS -->
      </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <script>
      // ═══════════════════════════════════════════════
      // STATE
      // ═══════════════════════════════════════════════
      // ADMIN I18N
      var currentAdminLang = localStorage.getItem("admin_lang") || "lo";
      document.documentElement.setAttribute("data-lang", currentAdminLang);
      document.documentElement.lang = currentAdminLang;
      function adminT(key) {
        var d = {

      const API = "/api/admin";

      async function api(method, path, body) {
        // Normalize paths without a leading slash so "coupons?page=1"
        // becomes "/api/admin/coupons?page=1", not "/api/admincoupons?page=1".
        if (path[0] !== "/") path = "/" + path;
        const opts = {
          method,
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + TOKEN,
          },
        };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(API + path, opts);
        const json = await res.json().catch(() => null);
        if (res.status === 401 || res.status === 403) {
          doLogout();
          throw new Error(adminT("sessionExpired"));
        }
        if (!res.ok)
          throw new Error(json && json.error ? json.error : "Request failed");
        return json;
      }

      // ── Pagination helper ──
      function renderPagination(current, totalPages, fnName) {
        if (totalPages <= 1) return "";
        let h =
          '<div style="margin-top:16px;display:flex;gap:6px;justify-content:center;">';
        if (current > 1)
          h += `<button onclick="${fnName}(${current - 1})" style="padding:6px 12px;border:1px solid #d1d5db;border-radius:4px;cursor:pointer;">${adminT("prev")}</button>`;
        h += `<span style="padding:6px 12px;color:#6B7280;">Page ${current} of ${totalPages}</span>`;
        if (current < totalPages)
          h += `<button onclick="${fnName}(${current + 1})" style="padding:6px 12px;border:1px solid #d1d5db;border-radius:4px;cursor:pointer;">${adminT("next")}</button>`;
        h += "</div>";
        return h;
      }

      // ═══════════════════════════════════════════════
      // AUTH
      // ═══════════════════════════════════════════════
      var _loggingIn = false;
      async function doLogin() {
        if (_loggingIn) return;
        _loggingIn = true;
        const btn = document.getElementById("loginBtn");
        if (btn) {
          btn.disabled = true;
          btn.textContent = adminT("loading");
        }
        const email = document.getElementById("loginEmail").value.trim();
        const pass = document.getElementById("loginPass").value;
        const errEl = document.getElementById("loginError");
        errEl.style.display = "none";
        if (!email || !pass) {
          errEl.textContent = adminT("loginError");
          errEl.style.display = "block";
          _loggingIn = false;
          if (btn) {
            btn.disabled = false;
            btn.textContent = adminT("loginBtn");
          }
          return;
        }
        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password: pass }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || adminT("loginFailed"));
          // Check admin role
          const profile = await fetch("/api/auth/me", {
            headers: { Authorization: "Bearer " + data.token },
          });
          const me = await profile.json();
          if (me.role !== "admin") throw new Error(adminT("accessDenied"));
          TOKEN = data.token;
          localStorage.setItem("admin_token", TOKEN);
          showAdminShell();
        } catch (e) {
          errEl.textContent = e.message;
          errEl.style.display = "block";
        } finally {
          _loggingIn = false;
          if (btn) {
            btn.disabled = false;
            btn.textContent = adminT("loginBtn");
          }
        }
      }

      function doLogout() {
        TOKEN = null;
        localStorage.removeItem("admin_token");
        document.getElementById("loginScreen").classList.remove("hidden");
        document.getElementById("adminShell").classList.add("hidden");
      }

      function showAdminShell() {
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("adminShell").classList.remove("hidden");
        refreshSidebar();
        navigateTo("dashboard");
      }

      // Auto-login if token exists
      if (TOKEN) {
        fetch("/api/auth/me", { headers: { Authorization: "Bearer " + TOKEN } })
          .then((r) => r.json())
          .then((me) => {
            if (me.role === "admin") showAdminShell();
            else doLogout();
          })
          .catch(() => doLogout());
      }

      // Enter key on login
      document.getElementById("loginPass").addEventListener("keydown", (e) => {
        if (e.key === "Enter") doLogin();

      async function uploadProductImage(productId) {
        var input = document.getElementById("imgFile");
        if (!input || !input.files || !input.files[0]) {
          showToast(adminT("selectFile"), true);
          return;
        }
        var file = input.files[0];
        if (file.size > 5 * 1024 * 1024) {
          showToast(adminT("fileTooLarge"), true);
          return;
        }
        var formData = new FormData();
        formData.append("image", file);
        try {
          var xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/admin/upload/image");
          xhr.setRequestHeader("Authorization", "Bearer " + TOKEN);
          xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
              var resp = JSON.parse(xhr.responseText);
              document.getElementById("imgUrl").value = resp.url;
              showToast(adminT("fileUploaded") + ": " + resp.filename);
            } else {
              var err = JSON.parse(xhr.responseText);
              showToast(err.error || adminT("uploadFailed"), true);
            }
          };
          xhr.onerror = function () {
            showToast(adminT("uploadFailed"), true);
          };
          xhr.send(formData);
        } catch (e) {
          showToast(adminT("uploadFailed"), true);
        }
      }

      // ═══════════════════════════════════════════════
      // AUDIT LOGS
      // ═══════════════════════════════════════════════
      let auditFilters = {
        action: "",
        module: "",
        search: "",
        fromDate: "",
        toDate: "",
        staffId: "",
      };
      let auditPage = 1;

      async function loadAuditLogs(page) {
        auditPage = page || 1;
        try {
          let qs = "page=" + auditPage + "&limit=50";
          if (auditFilters.action)
            qs += "&action=" + encodeURIComponent(auditFilters.action);
          if (auditFilters.module)
            qs += "&module=" + encodeURIComponent(auditFilters.module);
          if (auditFilters.search)
            qs += "&search=" + encodeURIComponent(auditFilters.search);
          if (auditFilters.fromDate) qs += "&fromDate=" + auditFilters.fromDate;
          if (auditFilters.toDate) qs += "&toDate=" + auditFilters.toDate;
          if (auditFilters.staffId) qs += "&staffId=" + auditFilters.staffId;
          const data = await api("GET", "/audit-logs?" + qs);
          const actionColor = {
            create: "#059669",
            update: "#2563EB",
            delete: "#DC2626",
            status_change: "#D97706",
            points_adjust: "#7C3AED",
          };
          const main = document.getElementById("adminMain");
          main.innerHTML = `
      <div class="page-header"><h2>📋 Audit Logs</h2><span style="color:var(--steel);font-size:13px">${data.total} total entries</span></div>
      <div style="background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
        <div><label style="font-size:11px;color:var(--steel);display:block;margin-bottom:4px">${adminT("actionLabel")}</label>
          <select id="al-action" style="padding:6px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px" onchange="auditFilters.action=this.value">
            <option value="">${adminT("filterAll")}</option><option value="create" ${auditFilters.action === "create" ? "selected" : ""}>${adminT("create")}</option>
            <option value="update" ${auditFilters.action === "update" ? "selected" : ""}>${adminT("update")}</option><option value="delete" ${auditFilters.action === "delete" ? "selected" : ""}>${adminT("delete")}</option>
            <option value="status_change" ${auditFilters.action === "status_change" ? "selected" : ""}>${adminT("statusChange")}</option>
            <option value="points_adjust" ${auditFilters.action === "points_adjust" ? "selected" : ""}>${adminT("pointsAdjust")}</option>
          </select></div>
        <div><label style="font-size:11px;color:var(--steel);display:block;margin-bottom:4px">${adminT("moduleFilter")}</label>
          <select id="al-module" style="padding:6px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px" onchange="auditFilters.module=this.value">
            <option value="">${adminT("filterAll")}</option><option value="products" ${auditFilters.module === "products" ? "selected" : ""}>${adminT("products")}</option>
            <option value="categories" ${auditFilters.module === "categories" ? "selected" : ""}>${adminT("categories")}</option>
            <option value="brands" ${auditFilters.module === "brands" ? "selected" : ""}>${adminT("brands")}</option>
            <option value="orders" ${auditFilters.module === "orders" ? "selected" : ""}>${adminT("orders")}</option>
            <option value="quotations" ${auditFilters.module === "quotations" ? "selected" : ""}>${adminT("quotations")}</option>
            <option value="customers" ${auditFilters.module === "customers" ? "selected" : ""}>${adminT("customers")}</option>
            <option value="staff" ${auditFilters.module === "staff" ? "selected" : ""}>${adminT("staffLabel")}</option>
            <option value="loyalty" ${auditFilters.module === "loyalty" ? "selected" : ""}>${adminT("loyalty")}</option>
          </select></div>
        <div><label style="font-size:11px;color:var(--steel);display:block;margin-bottom:4px">${adminT("search")}</label>
          <input id="al-search" value="${esc(auditFilters.search)}" placeholder="keyword..." style="padding:6px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px;width:160px"></div>
        <div><label style="font-size:11px;color:var(--steel);display:block;margin-bottom:4px">${adminT("fromDate")}</label>
          <input id="al-from" type="date" value="${auditFilters.fromDate}" style="padding:6px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px" onchange="auditFilters.fromDate=this.value"></div>
        <div><label style="font-size:11px;color:var(--steel);display:block;margin-bottom:4px">${adminT("toDate")}</label>
          <input id="al-to" type="date" value="${auditFilters.toDate}" style="padding:6px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px" onchange="auditFilters.toDate=this.value"></div>
        <button onclick="auditFilters.search=document.getElementById('al-search').value;auditFilters.fromDate=document.getElementById('al-from').value;auditFilters.toDate=document.getElementById('al-to').value;loadAuditLogs(1)" style="padding:6px 14px;background:var(--blueprint-deep);color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:13px">${adminT("filter")}</button>
        <button onclick="auditFilters={action:'',module:'',search:'',fromDate:'',toDate:'',staffId:''};loadAuditLogs(1)" style="padding:6px 14px;background:var(--line);color:var(--steel);border:none;border-radius:3px;cursor:pointer;font-size:13px">${adminT("clear")}</button>
      </div>
      <div class="a-table"><table>
        <thead><tr><th>${adminT("dateCol")}</th><th>${adminT("staffLabel")}</th><th>${adminT("actionLabel")}</th><th>${adminT("module")}</th><th>${adminT("details")}</th><th>${adminT("ip")}</th></tr></thead>
        <tbody>${
          data.logs.length
            ? data.logs
                .map((l) => {
                  const color = actionColor[l.action] || "#6B7280";
                  return `<tr>
          <td style="white-space:nowrap;font-size:12px">${new Date(l.created_at).toLocaleString()}</td>
          <td>${esc(l.staff_name)}</td>
          <td><span style="display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600;color:#fff;background:${color}">${esc(l.action)}</span></td>
          <td>${esc(l.module)}</td>
          <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;font-size:12px">${l.details ? esc(JSON.stringify(l.details)) : "—"}</td>
          <td style="font-size:12px;color:var(--steel)">${esc(l.ip_address || "—")}</td>
        </tr>`;
                })
                .join("")
            : '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--steel)">' +
              adminT("noAuditLogs") +
              "</td></tr>"
        }</tbody>
      </table></div>
      ${
        data.totalPages > 1
          ? `<div class="pagination" style="margin-top:16px;justify-content:center;display:flex;gap:6px">
        ${auditPage > 1 ? `<button onclick="loadAuditLogs(${auditPage - 1})">${adminT("prev")}</button>` : ""}
        ${Array.from({ length: Math.min(data.totalPages, 10) }, (_, i) => i + 1)
          .map(
            (p) =>
              `<button onclick="loadAuditLogs(${p})" class="${p === auditPage ? "active" : ""}">${p}</button>`,
          )
          .join("")}
        ${auditPage < data.totalPages ? `<button onclick="loadAuditLogs(${auditPage + 1})">${adminT("next")}</button>` : ""}
      </div>`
          : ""
      }
    `;
        } catch (e) {
          showToast(e.message, true);
        }
      }

      // ═══════════════════════════════════════════════
      // EMAIL NOTIFICATIONS — Phase 20
      // ═══════════════════════════════════════════════
      async function loadEmails(page) {
        const main = document.getElementById("adminMain");
        main.innerHTML =
          '<div class="loading"><div class="spinner"></div></div>';
        try {
          const p = page || 1;
          const r = await api("GET", `/emails?page=${p}&limit=15`);
          const list = Array.isArray(r) ? r : r.emails || [];
          let html =
            '<div class="page-header"><h2>📧 ' +
            adminT("emailInbox") +
            "</h2></div>";
          if (!list || list.length === 0) {
            html += '<p style="color:#6B7280;">' + adminT("noData") + "</p>";
          } else {
            html +=
              '<table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#f8f9fa;"><th style="padding:10px;text-align:left;">' +
              adminT("recipient") +
              "</th><th>" +
              adminT("subject") +
              "</th><th>" +
              adminT("typeField") +
              "</th><th>" +
              adminT("statusCol") +
              "</th><th>" +
              adminT("dateCol") +
              "</th></tr></thead><tbody>";
            for (const e of list) {
              const sc = e.status === "sent" ? "#059669" : "#DC2626";
              html += `<tr><td style="padding:10px;">${e.recipient || e.recipientEmail || ""}</td><td style="font-size:12px;">${e.subject || ""}</td><td><span style="font-size:11px;background:#f3f4f6;padding:2px 6px;border-radius:3px;">${adminT(e.type)}</span></td><td style="color:${sc};font-weight:600;">${adminT(e.status)}</td><td style="font-size:12px;">${new Date(e.created_at || e.createdAt).toLocaleString()}</td></tr>`;
            }
            html += "</tbody></table>";
          }
          html += Array.isArray(r)
            ? ""
            : renderPagination(r.page, r.totalPages, "loadEmails");
          main.innerHTML = html;
        } catch (e) {
          main.innerHTML = "<p>" + adminT("errorEmails") + "</p>";
        }
      }

      // ═══════════════════════════════════════════════
      // REVIEWS MANAGEMENT — Phase 19
      // ═══════════════════════════════════════════════
      let reviewFilter = {};
      async function loadReviews(page) {
        const main = document.getElementById("adminMain");
        main.innerHTML =
          '<div class="loading"><div class="spinner"></div></div>';
        try {
          const p = page || 1;
          let qs = `page=${p}&limit=10`;
          if (reviewFilter.status) qs += `&status=${reviewFilter.status}`;
          if (reviewFilter.rating) qs += `&rating=${reviewFilter.rating}`;
          if (reviewFilter.search)
            qs += `&search=${encodeURIComponent(reviewFilter.search)}`;
          const r = await api("GET", `/reviews?${qs}`);
          let html = `<div class="page-header"><h2>⭐ ${adminT("reviews")}</h2></div>`;
          html += `<div class="filters" style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">`;
          html += `<select id="reviewStatusFilter" onchange="reviewFilter.status=this.value==='all'?null:this.value;loadReviews(1)" style="padding:8px;border:1px solid #d1d5db;border-radius:6px;">
      <option value="all" ${!reviewFilter.status ? "selected" : ""}>${adminT("allStatus")}</option>
      <option value="pending" ${reviewFilter.status === "pending" ? "selected" : ""}>${adminT("pending")}</option>
      <option value="approved" ${reviewFilter.status === "approved" ? "selected" : ""}>${adminT("approvedReview")}</option>
      <option value="rejected" ${reviewFilter.status === "rejected" ? "selected" : ""}>${adminT("rejectedReview")}</option></select>`;
          html += `<select id="reviewRatingFilter" onchange="reviewFilter.rating=this.value==='all'?null:this.value;loadReviews(1)" style="padding:8px;border:1px solid #d1d5db;border-radius:6px;">
      <option value="all" ${!reviewFilter.rating ? "selected" : ""}>${adminT("allRatings")}</option>
      <option value="5" ${reviewFilter.rating === "5" ? "selected" : ""}>★★★★★</option>
      <option value="4" ${reviewFilter.rating === "4" ? "selected" : ""}>★★★★</option>
      <option value="3" ${reviewFilter.rating === "3" ? "selected" : ""}>★★★</option>
      <option value="2" ${reviewFilter.rating === "2" ? "selected" : ""}>★★</option>
      <option value="1" ${reviewFilter.rating === "1" ? "selected" : ""}>★</option></select>`;
          html += `<input type="text" placeholder="Search reviews..." id="reviewSearch" value="${reviewFilter.search || ""}" onkeydown="if(event.key==='Enter'){reviewFilter.search=this.value;loadReviews(1)}" style="padding:8px;border:1px solid #d1d5db;border-radius:6px;flex:1;min-width:200px;" />`;
          html += `</div>`;
          if (!r.reviews || r.reviews.length === 0) {
            html += '<p style="color:#6B7280;">' + adminT("noReviews") + "</p>";
          } else {
            html +=
              '<table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#f8f9fa;"><th style="padding:10px;text-align:left;">' +
              adminT("productCol") +
              "</th><th>" +
              adminT("customer") +
              "</th><th>" +
              adminT("rating") +
              "</th><th>" +
              adminT("comment") +
              "</th><th>" +
              adminT("statusCol") +
              "</th><th>" +
              adminT("dateCol") +
              "</th><th>" +
              adminT("actionLabel") +
              "</th></tr></thead><tbody>";
            for (const rv of r.reviews) {
              const sc =
                rv.status === "approved"
                  ? "#059669"
                  : rv.status === "rejected"
                    ? "#DC2626"
                    : "#6B7280";
              html += `<tr><td style="padding:10px;">${rv.product?.sku || ""}</td><td>${rv.customer?.name || ""}<br><small>${rv.customer?.email || ""}</small></td><td>${"★".repeat(rv.rating)}${"☆".repeat(5 - rv.rating)}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${rv.title || ""} ${rv.comment || ""}</td><td><span style="color:${sc};font-weight:600;">${adminT(rv.status)}</span></td><td>${new Date(rv.createdAt).toLocaleDateString()}</td><td>`;

      async function saveShipping(id) {
        var body = {
          name: v("shipName"),
          phone: v("shipPhone") || null,
          email: v("shipEmail") || null,
        };
        if (!body.name) {
          showToast(adminT("nameRequired"), true);
          return;
        }
        try {
          if (id) {
            await api("PUT", "shipping/companies/" + id, body);
          } else {
            var cr = await api("POST", "shipping/companies", body);
            id = cr.id;
          }
          try {
            var old = await api("GET", "shipping/companies/" + id);
            for (var b of old.branches || []) {
              try {
                await api(
                  "DELETE",
                  "shipping/companies/" + id + "/branches/" + b.id,
                );
              } catch (e) {}
            }
          } catch (e) {}
          var names = document.querySelectorAll(".branch-name");
          var addrs = document.querySelectorAll(".branch-addr");
          var phones = document.querySelectorAll(".branch-phone");
          for (var i = 0; i < names.length; i++) {
            var bn = names[i].value.trim();
            if (bn) {
              try {
                await api("POST", "shipping/companies/" + id + "/branches", {
                  name: bn,
                  address: addrs[i] ? addrs[i].value.trim() : null,
                  phone: phones[i] ? phones[i].value.trim() : null,
                });
              } catch (e) {}
            }
          }
          showToast(adminT("saved"));
          hideModal();
          loadShipping();
        } catch (e) {
          showToast(e.message, true);
        }
      }

        try {

          showToast(adminT("deleted"));

        } catch (e) {
          showToast(e.message, true);

      }

              var variants = await api("GET", "products/" + p.id + "/variants");
              if (variants && variants.length > 0) {
                for (var j = 0; j < variants.length; j++) {
                  var vr = variants[j];
                  found = true;
                  h +=
                    "<tr><td>" +
                    esc(p.name_lo || p.sku) +
                    '</td><td class="code">' +
                    esc(p.sku) +
                    '</td><td class="code">' +
                    esc(vr.sku) +
                    "</td><td>" +
                    esc(vr.name || "\u2014") +
                    "</td><td>" +
                    (vr.price ? vr.price.toLocaleString() + " KIP" : "\u2014") +
                    "</td><td>" +
                    vr.stock +
                    "</td>";
                  h +=
                    '<td><span class="status-pill ' +
                    (vr.isActive ? "st-active" : "st-inactive") +
                    '">' +
                    (vr.isActive
                      ? adminT("activeLabel")
                      : adminT("inactiveLabel")) +
                    "</span></td>";
                  h +=
                    '<td class="actions"><button class="btn-sm" onclick="deleteVariant(' +
                    p.id +
                    "," +
                    vr.id +
                    ')" style="color:#DC2626">' +
                    adminT("delete") +
                    "</button></td></tr>";
                }
              }
            } catch (e) {}
          }
          if (!found)
            h +=
              '<tr><td colspan="8" style="text-align:center;padding:24px;color:#9CA3AF">' +
              adminT("noVariantsHelp") +
              "</td></tr>";
          h += "</table></div>";
          main.innerHTML = h;
        } catch (e) {
          showToast(e.message, true);
        }
      }
      async function deleteVariant(pid, vid) {
        if (!confirm(adminT("deleteVariantConfirm") + "?")) return;
        try {
          await api("DELETE", "products/" + pid + "/variants/" + vid);
          showToast(adminT("deleted"));
          loadVariants();
        } catch (e) {
          showToast(e.message, true);
        }
      }

      // MODAL / TOAST / UTILS
      // ═══════════════════════════════════════════════
      function showModal(html) {
        document.getElementById("modalContainer").innerHTML =
          `<div class="modal-overlay" onclick="if(event.target===this)hideModal()"><div class="modal-box">${html}</div></div>`;
      }
      function hideModal() {
        document.getElementById("modalContainer").innerHTML = "";
      }

      function showToast(msg, isError) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.className = "toast show" + (isError ? " error" : "");
        setTimeout(() => (t.className = "toast"), 3000);
      }

      function v(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : "";
      }
    </script>
  </body>
</html>
